name: Project Structure Folders Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "projects/documentary_project.py"
      - "projects/folder_engine.py"
      - "projects/folder_explorer.py"
      - "projects/workspace_file_ops.py"
      - "projects/workspace_search.py"
      - "projects/workspace_recycle_bin.py"
      - "projects/workspace_permissions.py"
      - "projects/workspace_quota.py"
      - "projects/workspace_quota_ops.py"
      - "projects/workspace_versioning.py"
      - "tests/test_project_structure.py"
      - "tests/test_folder_engine.py"
      - "tests/test_folder_explorer.py"
      - "tests/test_workspace_file_ops.py"
      - "tests/test_workspace_search.py"
      - "tests/test_workspace_recycle_bin.py"
      - "tests/test_workspace_permissions.py"
      - "tests/test_workspace_quota.py"
      - "tests/test_workspace_quota_ops.py"
      - "tests/test_workspace_versioning.py"
      - ".github/workflows/project-structure-folders.yml"
  push:
    branches:
      - main
      - feature/project-structure-folders-hardening
    paths:
      - "projects/documentary_project.py"
      - "projects/folder_engine.py"
      - "projects/folder_explorer.py"
      - "projects/workspace_file_ops.py"
      - "projects/workspace_search.py"
      - "projects/workspace_recycle_bin.py"
      - "projects/workspace_permissions.py"
      - "projects/workspace_quota.py"
      - "tests/test_project_structure.py"
      - "tests/test_folder_engine.py"
      - "tests/test_folder_explorer.py"
      - "tests/test_workspace_file_ops.py"
      - "tests/test_workspace_search.py"
      - "tests/test_workspace_recycle_bin.py"
      - "tests/test_workspace_permissions.py"
      - "tests/test_workspace_quota.py"
      - "projects/workspace_quota_ops.py"
      - "projects/workspace_versioning.py"
      - "tests/test_workspace_quota_ops.py"
      - "tests/test_workspace_versioning.py"
      - ".github/workflows/project-structure-folders.yml"

permissions:
  contents: read

jobs:
  project-structure-tests:
    name: project-structure (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile feature code and tests
        run: python -m compileall -q projects/documentary_project.py projects/folder_engine.py projects/folder_explorer.py projects/workspace_file_ops.py projects/workspace_search.py projects/workspace_recycle_bin.py projects/workspace_permissions.py projects/workspace_quota.py projects/workspace_quota_ops.py projects/workspace_versioning.py tests/test_project_structure.py tests/test_folder_engine.py tests/test_folder_explorer.py tests/test_workspace_file_ops.py tests/test_workspace_search.py tests/test_workspace_recycle_bin.py tests/test_workspace_permissions.py tests/test_workspace_quota.py tests/test_workspace_quota_ops.py tests/test_workspace_versioning.py
      - name: Run Project Structure / Folders tests
        run: python -m unittest tests.test_project_structure tests.test_folder_engine tests.test_folder_explorer tests.test_workspace_file_ops tests.test_workspace_search tests.test_workspace_recycle_bin tests.test_workspace_permissions tests.test_workspace_quota tests.test_workspace_quota_ops tests.test_workspace_versioning -v
