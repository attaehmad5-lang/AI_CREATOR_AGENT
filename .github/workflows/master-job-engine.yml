name: Master Job Engine Offline Regression

on:
  push:
    paths:
      - 'agents/jobs/**'
      - 'tests/test_master_job_engine.py'
      - 'tests/test_master_artifact_integrity.py'
      - 'tests/test_master_reconciliation.py'
      - 'tests/test_master_disaster_recovery.py'
      - 'tests/test_master_tenant_gateway.py tests/test_master_request_quota.py'
      - 'scripts/offline_tenant_api_acceptance.py'
      - 'docs/master-job-tenant-gateway.md'
      - 'scripts/offline_media_acceptance.py'
      - '.github/workflows/master-job-engine.yml'
  pull_request:
    paths:
      - 'agents/jobs/**'
      - 'tests/test_master_job_engine.py'
      - 'tests/test_master_artifact_integrity.py'
      - 'tests/test_master_reconciliation.py'
      - 'tests/test_master_disaster_recovery.py'
      - 'tests/test_master_tenant_gateway.py'
      - 'scripts/offline_tenant_api_acceptance.py'
      - 'docs/master-job-tenant-gateway.md'
      - 'scripts/offline_media_acceptance.py'
      - '.github/workflows/master-job-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  master-job-engine:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check compiled module and regression test
        run: python -m compileall -q agents/jobs tests/test_master_job_engine.py tests/test_master_artifact_integrity.py tests/test_master_reconciliation.py tests/test_master_disaster_recovery.py tests/test_master_tenant_gateway.py scripts/offline_tenant_api_acceptance.py
      - name: Offline workflow and CLI integration tests
        run: python -m unittest discover -s tests -p 'test_master*.py' -v

      - name: Signed tenant API loopback HTTP acceptance (no cloud calls)
        run: python -m scripts.offline_tenant_api_acceptance
