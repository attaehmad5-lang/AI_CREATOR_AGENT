name: Task 25 Pollinations Read-only Account Balance Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pollinations-account-balance:
    name: Read-only Pollinations account balance check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify account:usage scope and wallet balance response
        run: |
          python - <<'PY'
          from projects.provider_store.account_balance_probe import PollinationsAccountBalanceProbe

          result = PollinationsAccountBalanceProbe()("pollinations")
          print("status:", result.get("status"))
          print("account_balance_verified:", result.get("verified") is True)
          print("required_scope:", result.get("required_scope", "account:usage"))
          # Deliberately do not print the balance amount, API key, or response body.
          raise SystemExit(0 if result.get("verified") is True else 1)
          PY
