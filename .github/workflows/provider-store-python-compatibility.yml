name: Provider Store Python Compatibility

on:
  push:
    branches:
      - task-25-provider-connection-manager
      - advanced-provider-store-hardening-20261027
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: provider-store-python-compat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-compatibility:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
      python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile provider modules and tests
        run: python -m compileall -q projects/provider_store tests
      - name: Validate provider JSON catalogs
        run: |
          python -c "import json; from pathlib import Path; [json.loads(p.read_text(encoding='utf-8')) for p in Path('projects/provider_store').rglob('*.json')]"
      - name: Run unit and regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build reproducible wheel and test clean installation
        run: python -m projects.provider_store.advanced.verify_wheel
