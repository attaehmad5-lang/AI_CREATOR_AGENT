name: Feature 69 Full-History Secret Scan

on:
  push:
    branches:
      - task25-feature69-encrypted-state-store
  pull_request:
    branches:
      - main
  schedule:
    - cron: "31 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature69-secret-history-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks-full-history:
    name: Redacted full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks binary and verify checksum
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' \
            "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" \
            "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan every reachable commit with fully redacted findings
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/gitleaks-results.json"
          set +e
          "$RUNNER_TEMP/gitleaks" git . \
            --log-opts="--all" \
            --gitleaks-ignore-path .gitleaksignore \
            --redact \
            --no-banner \
            --no-color \
            --report-format json \
            --report-path "$report" \
            --exit-code 1
          scan_status=$?
          set -e

          # Print finding metadata only; never emit Secret, Match, or source snippets.
          if [ -s "$report" ]; then
            python - "$report" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              findings = json.load(handle)
          print(f"Redacted metadata summary: {len(findings)} finding(s)")
          for item in findings:
              print(
                  "rule={rule} file={file} line={line} commit={commit} fingerprint={fingerprint}".format(
                      rule=item.get("RuleID", "unknown"),
                      file=item.get("File", "unknown"),
                      line=item.get("StartLine", "?"),
                      commit=item.get("Commit", "unknown"),
                      fingerprint=item.get("Fingerprint", "unknown"),
                  )
              )
          PY
          fi
          exit "$scan_status"
