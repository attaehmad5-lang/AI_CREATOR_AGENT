name: Task 25 Provider Connection Manager Tests

on:
  push:
    branches:
      - task-25-provider-connection-manager
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  provider-connection-manager:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
