name: Task 25 Provider Connection Manager Tests

on:
  push:
    branches:
      - 'task-25-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  provider-connection-manager:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile provider modules and tests
        run: python -m compileall -q projects/provider_store tests
      - name: Validate provider JSON catalogs
        run: |
          python -c "import json; from pathlib import Path; [json.loads(p.read_text(encoding='utf-8')) for p in Path('projects/provider_store').rglob('*.json')]"
      - name: Run unit and regression tests in batches of 50
        run: python tests/run_in_batches.py
