name: Advanced Provider Store Release Gate

on:
  workflow_dispatch:
  push:
    tags:
      - "advanced-provider-store-v*"

permissions:
  contents: read

jobs:
  release-readiness:
    name: Enforce ledger and build verified release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact release ref
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned release-quality tools
        run: python -m pip install ruff==0.14.2 mypy==1.18.2 coverage==7.13.1
      - name: Lint and format-check release-critical modules
        run: |
          python -m ruff check projects/provider_store/catalog_interchange.py projects/provider_store/catalog_diff.py projects/provider_store/catalog_cli.py projects/provider_store/provider_config_lifecycle.py projects/provider_store/provider_outage_detector.py projects/provider_store/health_scheduler.py projects/provider_store/provider_structured_logger.py projects/provider_store/advanced/release_report.py projects/provider_store/advanced/pdf_report.py projects/provider_store/advanced/performance_benchmark.py projects/provider_store/generate_api_reference.py tests/test_generate_provider_store_api_reference.py tests/test_provider_store_fuzz_regressions.py tests/test_catalog_interchange.py tests/test_catalog_diff.py tests/test_catalog_cli.py tests/test_provider_config_lifecycle.py tests/test_advanced_provider_release_report.py
          python -m ruff format --check projects/provider_store/catalog_interchange.py projects/provider_store/catalog_diff.py projects/provider_store/advanced/performance_benchmark.py projects/provider_store/generate_api_reference.py tests/test_generate_provider_store_api_reference.py tests/test_provider_store_fuzz_regressions.py tests/test_catalog_interchange.py tests/test_catalog_diff.py tests/test_provider_store_performance_benchmark.py
      - name: Type-check release-critical modules
        run: python -m mypy --ignore-missing-imports --follow-imports=silent --check-untyped-defs projects/provider_store/catalog_interchange.py projects/provider_store/catalog_diff.py projects/provider_store/catalog_cli.py projects/provider_store/provider_outage_detector.py projects/provider_store/health_scheduler.py projects/provider_store/provider_structured_logger.py projects/provider_store/advanced/release_report.py projects/provider_store/advanced/pdf_report.py projects/provider_store/advanced/performance_benchmark.py projects/provider_store/advanced/verify_wheel.py projects/provider_store/generate_api_reference.py
      - name: Enforce focused source coverage
        run: |
          python -m coverage run --source=projects.provider_store.catalog_interchange,projects.provider_store.catalog_diff,projects.provider_store.catalog_cli,projects.provider_store.provider_config_lifecycle,projects.provider_store.provider_outage_detector,projects.provider_store.health_scheduler,projects.provider_store.provider_structured_logger,projects.provider_store.advanced.release_report,projects.provider_store.advanced.pdf_report,projects.provider_store.advanced.performance_benchmark,projects.provider_store.generate_api_reference -m unittest discover -s tests -p "test_*.py"
          python -m coverage report --fail-under=65
      - name: Verify reproducible wheel and clean installation
        run: python -m projects.provider_store.advanced.verify_wheel
      - name: Run bounded catalog benchmark
        run: python -m projects.provider_store.advanced.performance_benchmark --iterations 25 --workers 4 --max-seconds 15
      - name: Compile provider store and tests
        run: python -m compileall -q projects/provider_store tests
      - name: Validate all provider catalog JSON
        run: python -c "import json; from pathlib import Path; [json.loads(p.read_text(encoding='utf-8')) for p in Path('projects/provider_store').rglob('*.json')]"
      - name: Run provider-store regression tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Generate source-derived Python API reference
        run: python -m projects.provider_store.generate_api_reference --output projects/provider_store/PROVIDER_STORE_PYTHON_API.md
      - name: Enforce all 150 ledger points before release
        run: python -m projects.provider_store.advanced.release_report --output-dir build/advanced-provider-store-release --require-complete
      - name: Upload verified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: advanced-provider-store-release
          path: build/advanced-provider-store-release/
          if-no-files-found: error
