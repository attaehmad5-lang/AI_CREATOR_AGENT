name: Provider Store Integration Verification

on:
  pull_request:
    paths:
      - "projects/provider_store/**"
      - "tests/test_provider_store_compat.py"
      - "tests/test_provider_service.py"
      - "tests/test_advanced_store_bridge.py"
      - "tests/test_advps_core.py"
      - "projects/provider_store/advanced/tools_coverage.py"
      - ".github/workflows/provider-store-integration.yml"
  push:
    branches:
      - main
      - task-advanced-provider-store-review
    paths:
      - "projects/provider_store/**"
      - "tests/test_provider_store_compat.py"
      - "tests/test_provider_service.py"
      - "tests/test_advanced_store_bridge.py"
      - ".github/workflows/provider-store-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-store-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Provider Store / Python ${{ matrix.python-version }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile provider-store modules and integration tests
        run: python -m compileall -q projects/provider_store tests/test_provider_store_compat.py tests/test_provider_service.py tests/test_advanced_store_bridge.py tests/test_advps_core.py projects/provider_store/advanced/tools_coverage.py

      - name: Validate provider catalogs
        run: |
          python -c "import json; from pathlib import Path; paths=[Path('projects/provider_store/provider_catalog.json'), Path('projects/provider_store/advanced/advanced_provider_catalog.json')]; [json.loads(p.read_text(encoding='utf-8')) for p in paths]; print('Provider catalog JSON: PASS')"

      - name: Run ProviderService security and lifecycle tests
        run: python -m unittest discover -s tests -p "test_provider_service.py" -v

      - name: Run provider-store compatibility regression tests
        run: python -m unittest discover -s tests -p "test_provider_store_compat.py" -v

      - name: Run advanced bridge contract tests
        run: python -m unittest discover -s tests -p "test_advanced_store_bridge.py" -v

      - name: Run Advanced Provider Store core tests
        run: python -m unittest discover -s tests -p "test_advps_core.py" -v

      - name: Run repository coverage gate for provider-store core (Linux only)
        if: runner.os == 'Linux'
        run: python projects/provider_store/advanced/tools_coverage.py 80
