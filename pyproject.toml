[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-creator-agent-provider-store"
version = "0.1.0"
description = "Provider catalog, lifecycle, routing and safe maintenance utilities for AI_CREATOR_AGENT"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["projects.provider_store*"]
namespaces = true

[tool.setuptools.package-data]
"projects.provider_store" = ["*.json", "*.md", "advanced/*.json", "advanced/*.md", "providers/**/*.json"]
